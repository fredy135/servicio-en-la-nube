<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Intereses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card p-4 bg-white">
                    <h2 class="text-center mb-4 fw-bold">Calculadora de Intereses</h2>
                    
                    <div class="mb-3">
                        <label for="monto" class="form-label fw-semibold">Monto del Préstamo ($):</label>
                        <input type="number" id="monto" class="form-control" placeholder="Ej. 1000" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="tasa" class="form-label fw-semibold">Tasa de Interés Anual (%):</label>
                        <input type="number" id="tasa" class="form-control" placeholder="Ej. 10" required>
                    </div>
                    
                    <button id="btnCalcular" class="btn btn-primary w-100 py-2 fw-semibold mb-4">Calcular Intereses</button>
                    
                    <div id="contenedorResultado" class="p-3 bg-light rounded border" style="display: none;">
                        <h5 class="fw-bold text-dark mb-2">Resultado del Servidor:</h5>
                        <div id="resultado"></div>
                    </div>
                    
                </div>

            </div>
        </div>
    </div>

    <script>
        document.getElementById('btnCalcular').addEventListener('click', function() {

            const monto = document.getElementById('monto').value;
            const tasa = document.getElementById('tasa').value;

            if (!monto || !tasa) {
                alert('Por favor, llena ambos campos.');
                return;
            }

            const datos = {
                monto: parseFloat(monto),
                tasa: parseFloat(tasa)
            };

            fetch('https://app-nube-7c4es.ondigitalocean.app/api/calcular', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error en la respuesta del servidor');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('contenedorResultado').style.display = 'block';
                document.getElementById('resultado').innerHTML = `
                    <p class="mb-1">Interés mensual: $${data.interes_mensual}</p>
                    <p class="mb-0">Total a pagar: $${data.total_pagar}</p>
                `;
            })
            .catch(error => {
                console.error('Error original:', error);
                alert('Error al conectar con la capa 2. Revisa que el backend esté activo.');
            });
        });
    </script>

</body>
</html>
