<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora en la Nube</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #0080ff; color: white; border: none; cursor: pointer; font-weight: bold; }
        #resultado { margin-top: 20px; padding: 10px; background: #e6f2ff; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <h2>Calculadora de Intereses</h2>
    <label>Monto del Préstamo ($):</label>
    <input type="number" id="monto" value="1000">
    
    <label>Tasa de Interés Anual (%):</label>
    <input type="number" id="tasa" value="12">

    <button onclick="enviarDatos()">Calcular Intereses</button>

    <div id="resultado"></div>

    <script>
        async function enviarDatos() {
            const monto = document.getElementById('monto').value;
            const tasa = document.getElementById('tasa').value;
            const divResultado = document.getElementById('resultado');

            const URL_BACKEND = "https://app-nube-7c4es.ondigitalocean.app/calcular";

            try {
                const respuesta = await fetch(URL_BACKEND, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ monto: monto, tasa: tasa })
                });
                
                const datos = await respuesta.json();
                divResultado.style.display = "block";
                divResultado.innerHTML = `<strong>Resultado del Servidor:</strong><br>Interés mensual: $${datos.interes_mensual}<br>Total a pagar: $${datos.total_pagar}`;
            } catch (error) {
                divResultado.style.display = "block";
                divResultado.innerHTML = " Error al conectar con la Capa 2";
            }
        }
    </script>
</body>
</html>
